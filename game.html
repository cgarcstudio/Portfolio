<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGARC STUDIO | GAME ART</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="page-bg-wallpaper"></div>

    <div class="main-wrapper" id="main-content-wrapper">
        <header class="inner-header">
            <a href="index.html" class="header-branding">
                <img src="public/logo.png" alt="CGARC STUDIO" class="header-logo">
                <span class="header-title">CGARC STUDIO <span class="slash">/</span> <span class="category-name">GAME ART</span></span>
            </a>

            <div class="nav-toggle-container" id="menu-trigger">
                <div class="nav-toggle">
                    <span class="line-long"></span>
                    <span class="line-medium"></span>
                    <span class="line-short"></span>
                </div>
                <div class="fullscreen-menu">
                    <nav class="menu-links">
                        <a href="index.html" class="active-link">HOME</a>
                        <a href="about.html">ABOUT US</a>
                        <a href="contact.html">CONTACT US</a>
                    </nav>
                    <div class="menu-socials">
                        <a href="#">ARTSTATION</a>
                        <a href="#">LINKEDIN</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="grid-container" id="projects-grid"></main>

        <footer class="page-footer">
            <p>&copy; 2026 CGArc Studio. All Rights Reserved.</p>
        </footer>
    </div>

    <button id="scrollTopBtn" title="Go to top">&#10148;</button>

    <script src="products-db.js"></script>

    <script>
        // تابع قالب کامپوننت (موتور ساخت کارت‌ها)
        function createCardComponent(project) {
            return `
                <a href="${project.url}" class="card game-art-card">
                    <div class="card-image-wrapper">
                        <div class="card-image" style="background-image: url('${project.cover}');"></div>
                        <div class="card-info">
                            <h3>${project.title}</h3>
                            <div class="card-details">
                                <p>${project.type}</p>
                            </div>
                        </div>
                    </div>
                </a>
            `;
        }

        // رندر خودکار محصولات از فایل خارجی دیتابیس
        function renderProjects() {
            const gridContainer = document.getElementById('projects-grid');
            if (gridContainer && typeof projectsData !== 'undefined') {
                gridContainer.innerHTML = projectsData.map(project => createCardComponent(project)).join('');
            }
        }

        window.addEventListener('DOMContentLoaded', renderProjects);

        // منطق بلور افکت منو
        const menuTrigger = document.getElementById('menu-trigger');
        const mainWrapper = document.getElementById('main-content-wrapper');
        if(menuTrigger && mainWrapper) {
            menuTrigger.addEventListener('mouseenter', () => mainWrapper.classList.add('menu-active'));
            menuTrigger.addEventListener('mouseleave', () => mainWrapper.classList.remove('menu-active'));
        }

        // منطق دکمه اسکرول به بالا
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollTopBtn.classList.add("visible");
            } else {
                scrollTopBtn.classList.remove("visible");
            }
        };
        scrollTopBtn.onclick = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    </script>
</body>
</html>
