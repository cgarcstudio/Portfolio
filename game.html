<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGARC STUDIO | GAME ART</title>
    
    <style>
        @font-face {
            font-family: 'CGArcFont';
            src: url('public/font.ttf') format('truetype');
        }

        :root {
            --bg-dark: #05070c;
            --accent-game: #e59a19;
            --accent-arch: #00b4d8;
            --card-dark: #0b0e14;
            --text-muted: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'CGArcFont', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow-x: hidden;
            scrollbar-width: none;
            position: relative;
            min-height: 100vh;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .main-wrapper {
            transition: filter 0.4s ease, opacity 0.4s ease;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        body:has(.nav-toggle-container:hover) .main-wrapper {
            filter: blur(12px);
            opacity: 0.4;
            pointer-events: none;
        }

        .page-bg-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('public/image/hub/game_bg.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        .inner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
            width: 100%;
            z-index: 50;
            position: relative;
        }

        .header-branding {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-right: 12px;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .header-title .slash {
            color: #5c6470;
            margin: 0 8px;
        }

        .header-title .category-name {
            color: var(--accent-game);
            letter-spacing: 2px;
        }

        .nav-toggle-container {
            position: relative;
            display: inline-block;
            padding: 10px;
            z-index: 60;
        }

        .nav-toggle {
            width: 32px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            cursor: pointer;
        }

        .nav-toggle span {
            display: block;
            height: 2px;
            background: #ffffff;
            transition: all 0.3s ease;
        }

        .nav-toggle .line-long { width: 100%; }
        .nav-toggle .line-medium { width: 75%; }
        .nav-toggle .line-short { width: 45%; }

        .nav-toggle-container:hover .nav-toggle .line-long { transform: translateY(8px) rotate(45deg); }
        .nav-toggle-container:hover .nav-toggle .line-medium { opacity: 0; }
        .nav-toggle-container:hover .nav-toggle .line-short { width: 100%; transform: translateY(-8px) rotate(-45deg); }

        /* سیستم گرید داینامیک ۳ ستونه عریض */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px; 
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 40px 120px 40px;
        }

        @media (max-width: 1024px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .grid-container { grid-template-columns: 1fr; } }

        .grid-container:has(.card:hover) .card:not(:hover) {
            filter: grayscale(30%) brightness(70%);
            opacity: 0.8;
        }

        .card {
            display: block;
            background: #0b0e14;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .game-art-card:hover {
            box-shadow: 0 15px 35px rgba(229, 154, 25, 0.25);
            border-color: rgba(229, 154, 25, 0.4);
        }

        .card-image-wrapper {
            width: 100%;
            padding-top: 100%; /* ساختار بی‌پایان مربع ۱:۱ */
            position: relative;
            overflow: hidden;
            border-radius: 16px;
        }

        .card-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image {
            transform: scale(1.05);
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(11, 14, 20, 0.95) 0%, rgba(11, 14, 20, 0.8) 70%, rgba(11, 14, 20, 0) 100%);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 5;
            text-align: left;
        }

        .card-info h3 {
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent-game);
            margin-bottom: 4px;
        }

        .card-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: 500;
        }

        .card:hover .card-info {
            opacity: 1;
            transform: translateY(0);
        }

        .fullscreen-menu {
            position: fixed;
            top: 0; right: -10px; width: 320px; height: 100vh;
            background: rgba(5, 7, 12, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding-right: 40px;
            opacity: 0;
            pointer-events: none;
            border-left: 1px solid rgba(255, 255, 255, 0.03);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translateX(100%);
        }

        .nav-toggle-container:hover .fullscreen-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 25px;
            margin-bottom: 60px;
        }

        .menu-links a {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .menu-links a:hover, .menu-links a.active-link { color: var(--accent-game); }
        .menu-socials { display: flex; gap: 20px; }
        .menu-socials a {
            font-size: 0.8rem;
            color: #5c6470;
            text-decoration: none;
            letter-spacing: 2px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .menu-socials a:hover { color: #ffffff; }

        #scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            border: 1px solid rgba(255,255,255,0.1);
            outline: none;
            background-color: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(5px);
            color: var(--accent-game);
            cursor: pointer;
            padding: 12px 16px;
            border-radius: 50%;
            font-size: 1.2rem;
            transform: rotate(-90deg) scale(0);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease, background-color 0.3s;
        }

        #scrollTopBtn.visible { transform: rotate(-90deg) scale(1); opacity: 1; }
        #scrollTopBtn:hover { background-color: var(--accent-game); color: #000000; }

        .page-footer {
            text-align: center;
            padding: 30px 20px;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(5, 7, 12, 0.8);
        }

        .page-footer p { font-size: 0.8rem; color: #5c6470; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="page-bg-wallpaper"></div>

    <div class="main-wrapper">
        <header class="inner-header">
            <a href="index.html" class="header-branding">
                <img src="public/logo.png" alt="CGARC STUDIO" class="header-logo">
                <span class="header-title">CGARC STUDIO <span class="slash">/</span> <span class="category-name">GAME ART</span></span>
            </a>

            <div class="nav-toggle-container">
                <div class="nav-toggle">
                    <span class="line-long"></span>
                    <span class="line-medium"></span>
                    <span class="line-short"></span>
                </div>
                <div class="fullscreen-menu">
                    <nav class="menu-links">
                        <a href="index.html" class="active-link">HOME</a>
                        <a href="about.html">ABOUT US</a>
                        <a href="contact.html">CONTACT US</a>
                    </nav>
                    <div class="menu-socials">
                        <a href="#">ARTSTATION</a>
                        <a href="#">LINKEDIN</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="grid-container" id="projects-grid"></main>

        <footer class="page-footer">
            <p>&copy; 2026 CGArc Studio. All Rights Reserved.</p>
        </footer>
    </div>

    <button id="scrollTopBtn" title="Go to top">&#10148;</button>

    <script>
        // دیتابیس مرکزی پروژه (تنها جایی که برای اضافه/کم کردن کارت‌ها ویرایش می‌کنی)
        const projectsData = [
            {
                "title": "LEICA Q3",
                "type": "FULL TUTORIAL",
                "cover": "public/image/game/covers/leica_q3_cover.webp",
                "url": "game_pages/leica_q3.html"
            },
            {
                "title": "COMBAT DRONE",
                "type": "FULL TUTORIAL",
                "cover": "public/image/game/covers/combat_drone_cover.webp",
                "url": "game_pages/combat_drone.html"
            },
            {
                "title": "AXES VOL.02",
                "type": "GAME READY BASE MESH",
                "cover": "public/image/game/covers/axes_cover_vol02.webp",
                "url": "game_pages/axes_v2.html"
            },
            {
                "title": "AXES VOL.01",
                "type": "GAME READY BASE MESH",
                "cover": "public/image/game/covers/axes_cover_vol01.webp",
                "url": "game_pages/axes_v1.html"
            },
            {
                "title": "DAGGERS VOL.02",
                "type": "GAME READY",
                "cover": "public/image/game/covers/dagger_cover_vol02.webp",
                "url": "game_pages/daggers_v2.html"
            },
            {
                "title": "DAGGERS VOL.01",
                "type": "GAME READY",
                "cover": "public/image/game/covers/dagger_cover_vol01.webp",
                "url": "game_pages/daggers_v1.html"
            }
        ];

        // قالب سازنده کامپوننت کارت (Component Core Function)
        function createCardComponent(project) {
            return `
                <a href="${project.url}" class="card game-art-card">
                    <div class="card-image-wrapper">
                        <div class="card-image" style="background-image: url('${project.cover}');"></div>
                        <div class="card-info">
                            <h3>${project.title}</h3>
                            <div class="card-details">
                                <p>${project.type}</p>
                            </div>
                        </div>
                    </div>
                </a>
            `;
        }

        // تابع رندر داینامیک دیتابیس درون گرید خالی وبسایت
        function renderProjects() {
            const gridContainer = document.getElementById('projects-grid');
            if (gridContainer) {
                // تبدیل داده‌ها به کامپوننت و تزریق یکپارچه
                gridContainer.innerHTML = projectsData.map(project => createCardComponent(project)).join('');
            }
        }

        // اجرای موتور تولید کامپوننت به محض لود شدن ساختار اولیه مرورگر
        window.addEventListener('load', renderProjects);

        // منطق دکمه اسکرول به بالا
        const scrollTopBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollTopBtn.classList.add("visible");
            } else {
                scrollTopBtn.classList.remove("visible");
            }
        };
        scrollTopBtn.onclick = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    </script>
</body>
</html>
